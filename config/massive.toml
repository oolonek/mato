# Set workspace to an existing writable directory containing MassIVE data, references and job outputs.
workspace = "/path/to/workspace"
flock_root = "../.."

[pipeline]
# Full dataset and top-N use the same pipeline; shorten the selected list to resume.
stages = ["validate", "ingest", "enrich", "picoto", "register", "annotate", "chemical_enrich", "kg_export", "kg_validate"]
top_n_stages = ["validate", "ingest", "enrich", "picoto", "register", "annotate", "chemical_enrich", "kg_export", "kg_validate"]


[dataset]
root = "sapayoa/MSV000102993"
doi = "10.25345/C55T3GD90"
metadata = "metadata/metadata/dbgi_massive_metadata_20260806.tsv"
ms_dir = "peak/peak"
taxon_column = "taxon_scientific_name"

[database]
path = "peregrino/flock.sqlite"
top_n_root = "mato/top-n"

[peregrino]
# Concurrent per-file Picoto registrations; ingestion remains transactional.
jobs = 4

[picoto]
output_dir = "picoto/massive"
jobs = 25

[annotation]
library = "hocofaisan/references/isdb_lotus_pos_energySum.mgf"
lotus_csv = "hocofaisan/references/230106_frozen_metadata.csv"
settings = "../../hocofaisan/config/example.toml"

[annotation.library_source]
url = "https://zenodo.org/records/14887271/files/isdb_lotus_pos_energySum.mgf?download=1"
md5 = "c025e3365ca913b46ec4f6637d381911"

[annotation.lotus_source]
url = "https://zenodo.org/records/7534071/files/230106_frozen_metadata.csv.gz?download=1"
md5 = "324579ae4a4785bf1b50b532b0a00eec"
compression = "gzip"

[indexes]
taxon_index = "mato/wikidata/taxa.sqlite"
chemical_index = "mato/wikidata/chemicals.sqlite"
create_missing = true

[knowledge_graph]
output_dir = "mato/massive-kg"
allow_partial = true

[qlever]
index_root = "mato/qlever-indexes"
ui_data = "mato/qlever-ui"
ui_image = "qleverui:latest"
ui_port = 7044

# Applied only with --topN: filter first, sort, then take up to N metadata rows.
[selection]
require_nonempty = ["observation_subject", "collector_full_name"]

[[selection.sort]]
column = "filename"
descending = false
