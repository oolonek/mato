# Portable example: copy to toy.local.toml, set real paths, and keep that file ignored.
# The job database, Picoto outputs, and reference files must be outside the source dataset.
flock_root = "../.."

[pipeline]
stages = ["validate", "ingest", "enrich", "picoto", "register", "annotate", "chemical_enrich"]

[dataset]
root = "/path/to/extracted/zenodo-10018590"
doi = "10.5281/zenodo.10018264"
metadata = "metadata/metadata.tsv"
ms_dir = "msdata/raw"
taxon_column = "source_taxon"

[database]
path = "/path/to/job/toy.sqlite"

[picoto]
output_dir = "/path/to/job/toy-picoto"
jobs = 2

[annotation]
library = "/path/to/references/isdb_lotus_pos_energySum.mgf"
lotus_csv = "/path/to/references/230106_frozen_metadata.csv"
settings = "../../hocofaisan/config/example.toml"
