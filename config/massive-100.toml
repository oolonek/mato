# Run the first 100 rows of the ORIGINAL MassIVE dataset with `mato run --max-rows 100`.
# Only the SQLite database and Picoto output are isolated from production and the 20-file run.
# The script invokes Jaiba after annotation, including when some files have annotation errors.
flock_root = "../.."

[pipeline]
stages = ["validate", "ingest", "enrich", "picoto", "register", "annotate"]

[dataset]
root = "/media/nvme8tb/isla-gabriela/sapayoa/MSV000102993"
doi = "10.25345/C55T3GD90"
metadata = "metadata/metadata/dbgi_massive_metadata_20260806.tsv"
ms_dir = "peak/peak"
taxon_column = "taxon_scientific_name"

[database]
path = "/media/nvme8tb/isla-gabriela/mato/massive-100/flock.sqlite"

[cunaguaro]
jobs = 2

[peregrino]
jobs = 4

[picoto]
output_dir = "/media/nvme8tb/isla-gabriela/mato/massive-100/picoto"
jobs = 8

[annotation]
library = "/media/nvme8tb/isla-gabriela/hocofaisan/references/isdb_lotus_pos_energySum.mgf"
lotus_csv = "/media/nvme8tb/isla-gabriela/hocofaisan/references/230106_frozen_metadata.csv"
settings = "../../hocofaisan/config/example.toml"
