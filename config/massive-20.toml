# Prepared by ../scripts/run_massive_20.py from MassIVE MSV000102993.
# Dataset, SQLite and Picoto outputs are separate from the full MassIVE pipeline.
flock_root = "../.."

[pipeline]
stages = ["validate", "ingest", "enrich", "picoto", "register", "annotate"]

[dataset]
root = "/media/nvme8tb/isla-gabriela/mato/massive-20/dataset"
doi = "10.25345/C55T3GD90"
metadata = "metadata/metadata.tsv"
ms_dir = "peak/peak"
taxon_column = "taxon_scientific_name"

[database]
path = "/media/nvme8tb/isla-gabriela/mato/massive-20/flock.sqlite"

[cunaguaro]
jobs = 2

[peregrino]
jobs = 2

[picoto]
output_dir = "/media/nvme8tb/isla-gabriela/mato/massive-20/picoto"
jobs = 4

[annotation]
library = "/media/nvme8tb/isla-gabriela/hocofaisan/references/isdb_lotus_pos_energySum.mgf"
lotus_csv = "/media/nvme8tb/isla-gabriela/hocofaisan/references/230106_frozen_metadata.csv"
settings = "../../hocofaisan/config/example.toml"
